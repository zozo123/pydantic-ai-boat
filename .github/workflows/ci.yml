name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright

  live:
    # The tests start real Boat sandboxes, so they run only where the `BOAT_API_KEY` secret is set
    # (not on pull requests from forks), one run at a time because Boat limits sandbox starts.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: boat-live
    env:
      BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
    steps:
      - if: env.BOAT_API_KEY == ''
        run: echo 'BOAT_API_KEY is not set; skipping the live tests.'
      - if: env.BOAT_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.BOAT_API_KEY != ''
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - if: env.BOAT_API_KEY != ''
        run: uv sync --locked
      - if: env.BOAT_API_KEY != ''
        run: uv run pytest tests -q
