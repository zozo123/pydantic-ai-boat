[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-boat"
version = "0.1.0"
description = "Boat cloud sandboxes as a Pydantic AI workspace, built on Boat's official Python SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yossi Eliaz", email = "yossi.eliaz@incredibuild.com" }]
requires-python = ">=3.11"
keywords = ["pydantic-ai", "agents", "sandbox", "boat", "workspace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # The upper bound is deliberate: the module uses core's private `_ShellFilesystem`, and the workspace
    # protocol it implements is checked against this range by core's conformance suite.
    "pydantic-ai-slim>=2.59.0,<3",
    "boat-sdk>=1.10.0,<2",
    # `abandon_on_cancel` in `anyio.to_thread.run_sync`.
    "anyio>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/zozo123/pydantic-ai-boat"
Repository = "https://github.com/zozo123/pydantic-ai-boat"
Issues = "https://github.com/zozo123/pydantic-ai-boat/issues"

[dependency-groups]
dev = [
    "pydantic-ai-harness>=0.59.0",
    "pyright>=1.1.414",
    "pytest>=9.0.3",
    "ruff>=0.16.8",
    "trio>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_boat"]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "Q", "UP", "I", "D", "RUF100"]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
ignore = ["D100", "D102", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pydantic_ai_boat"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
